<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101716">
  <title>VIM QUEST — Mode arcade</title>
  <link rel="stylesheet" href="arcade.css">
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="brand"><span class="brand-mark">V</span><span>VIM QUEST<small>ARCADE</small></span></div>
      <div class="stats">
        <div class="stat"><span>SCORE</span><b id="h-score">0</b></div>
        <div class="stat"><span>VAGUE</span><b id="h-wave">–</b></div>
        <div class="stat"><span>COMBO</span><b id="h-combo">×1</b></div>
        <div class="stat lives"><span>VIES</span><b id="h-lives">♥♥♥♥♥</b></div>
      </div>
      <div class="tools">
        <button id="b-pause" class="icon-btn" title="Pause (Échap)" aria-label="Pause">⏸</button>
        <button id="b-sound" class="icon-btn" title="Son" aria-label="Son">🔊</button>
      </div>
    </header>

    <section id="arena" class="arena" aria-label="Zone de jeu">
      <div id="enemies"></div>
      <div id="fx"></div>
      <div class="base"><span>▲ TA BASE — ne les laisse pas passer ▲</span></div>
    </section>

    <section id="inputbar" class="inputbar">
      <span id="mode-badge" class="mode-badge">NORMAL</span>
      <div id="typed" class="typed"><span class="placeholder">Tape directement les touches Vim — Échap annule ta saisie</span></div>
      <span id="msg" class="msg"></span>
    </section>
  </main>
  <div id="screen" class="screen"></div>
  <script src="vimcore.js"></script>
  <script src="drills.js"></script>
  <script src="arcade.js"></script>
</body>
</html>
